openapi: 3.0.0
info:
  title: FlowOrder Production Agent Skills
  version: 6.1.4.1
  description: FlowOrder正式网站Agent的6个边界清晰业务技能。标准风险排序由后端混合路由器直接执行；Coze主要处理开放解释和显式草稿请求。
servers:
- url: https://ai-foreign-trade-action-system-production-ce23.up.railway.app
paths:
  /api/agent/tools/orders/context:
    post:
      operationId: get_order_diagnostic_context
      summary: 读取订单诊断上下文
      description: 用于读取一笔明确订单的事实、消息、任务、等待、承诺和风险证据。适合“这笔订单”“刚才第一笔”等单订单追问；不要用于跨订单Top N排序。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_id:
                  type: string
                  description: 组织ID，演示环境填写ORG-DEMO
                  default: ORG-DEMO
                current_user_id:
                  type: string
                  description: 当前FlowOrder用户ID，例如USER-1或MANAGER-1
                  example: USER-1
                current_role:
                  type: string
                  description: 当前角色
                  enum:
                  - operator
                  - manager
                  default: operator
                allowed_owner_ids:
                  type: array
                  description: 可选的额外授权负责人ID
                  items:
                    type: string
                run_id:
                  type: string
                  description: start_agent_run返回的运行ID
                order_id:
                  type: string
                  description: FlowOrder订单内部ID或接口接受的订单ID
                event_limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
              required:
              - current_user_id
              - order_id
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: 请求参数或业务条件错误
        '401':
          description: 插件密钥错误
        '403':
          description: 无权限
        '404':
          description: 资源不存在
        '429':
          description: 达到工具调用或时间预算
  /api/agent/tools/task-drafts/create:
    post:
      operationId: create_task_draft
      summary: 生成任务草稿
      description: 仅在已经取得明确order_id，且用户明确要求创建任务/待办时使用。只创建草稿；可在同一次调用中创建审批，正式任务仍需人工确认。用户说“不要建任务”时禁止调用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_id:
                  type: string
                  description: 组织ID，演示环境填写ORG-DEMO
                  default: ORG-DEMO
                current_user_id:
                  type: string
                  description: 当前FlowOrder用户ID，例如USER-1或MANAGER-1
                  example: USER-1
                current_role:
                  type: string
                  description: 当前角色
                  enum:
                  - operator
                  - manager
                  default: operator
                allowed_owner_ids:
                  type: array
                  description: 可选的额外授权负责人ID
                  items:
                    type: string
                run_id:
                  type: string
                  description: start_agent_run返回的运行ID
                order_id:
                  type: string
                title:
                  type: string
                recommended_action:
                  type: string
                target:
                  type: string
                  enum:
                  - customer
                  - factory
                  - supplier
                  - internal
                  - manager
                owner_user_id:
                  type: string
                risk_level:
                  type: string
                  enum:
                  - low
                  - medium
                  - high
                  - critical
                business_deadline:
                  type: string
                  format: date-time
                evidence:
                  type: array
                  items:
                    type: string
                create_approval_request:
                  type: boolean
                  default: false
                  description: 是否在同一次调用中为CREATE_TASK创建关联人工审批，减少Agent往返次数
                approval_idempotency_key:
                  type: string
                  description: 可选审批幂等键；未提供时按run_id与order_id生成
              required:
              - current_user_id
              - order_id
              - title
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: 请求参数或业务条件错误
        '401':
          description: 插件密钥错误
        '403':
          description: 无权限
        '404':
          description: 资源不存在
        '429':
          description: 达到工具调用或时间预算
  /api/agent/tools/message-drafts/create:
    post:
      operationId: draft_message
      summary: 生成沟通草稿
      description: 仅在用户明确要求写邮件、回复或催办时使用。只生成待审核草稿，不自动发送；用户说“不要发消息”时仍可生成草稿，但不得声称已发送。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_id:
                  type: string
                  description: 组织ID，演示环境填写ORG-DEMO
                  default: ORG-DEMO
                current_user_id:
                  type: string
                  description: 当前FlowOrder用户ID，例如USER-1或MANAGER-1
                  example: USER-1
                current_role:
                  type: string
                  description: 当前角色
                  enum:
                  - operator
                  - manager
                  default: operator
                allowed_owner_ids:
                  type: array
                  description: 可选的额外授权负责人ID
                  items:
                    type: string
                run_id:
                  type: string
                  description: start_agent_run返回的运行ID
                order_id:
                  type: string
                recipient_role:
                  type: string
                  enum:
                  - customer
                  - supplier
                  - factory
                  - internal
                questions_to_ask:
                  type: array
                  items:
                    type: string
                user_instruction:
                  type: string
              required:
              - current_user_id
              - order_id
              - recipient_role
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: 请求参数或业务条件错误
        '401':
          description: 插件密钥错误
        '403':
          description: 无权限
        '404':
          description: 资源不存在
        '429':
          description: 达到工具调用或时间预算
  /api/agent/tools/approvals/status:
    post:
      operationId: get_approval_status
      summary: 查询审批状态
      description: 查询明确approval_id的状态。PENDING时不得假设动作已执行。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_id:
                  type: string
                  description: 组织ID，演示环境填写ORG-DEMO
                  default: ORG-DEMO
                current_user_id:
                  type: string
                  description: 当前FlowOrder用户ID，例如USER-1或MANAGER-1
                  example: USER-1
                current_role:
                  type: string
                  description: 当前角色
                  enum:
                  - operator
                  - manager
                  default: operator
                allowed_owner_ids:
                  type: array
                  description: 可选的额外授权负责人ID
                  items:
                    type: string
                run_id:
                  type: string
                  description: start_agent_run返回的运行ID
                approval_id:
                  type: string
              required:
              - current_user_id
              - approval_id
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: 请求参数或业务条件错误
        '401':
          description: 插件密钥错误
        '403':
          description: 无权限
        '404':
          description: 资源不存在
        '429':
          description: 达到工具调用或时间预算
  /api/agent/tools/bulk-updates/parse:
    post:
      operationId: parse_bulk_order_updates
      summary: 解析一段多订单进展文本
      description: 用户输入同时包含多笔订单号及进度、承诺、延期、等待或物流信息时使用。只生成字段更新候选和review_url，不写回正式订单；不要用于风险排序。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_id:
                  type: string
                  description: 组织ID，演示环境填写ORG-DEMO
                  default: ORG-DEMO
                current_user_id:
                  type: string
                  description: 当前FlowOrder用户ID，例如USER-1或MANAGER-1
                  example: USER-1
                current_role:
                  type: string
                  description: 当前角色
                  enum:
                  - operator
                  - manager
                  default: operator
                allowed_owner_ids:
                  type: array
                  description: 可选的额外授权负责人ID
                  items:
                    type: string
                run_id:
                  type: string
                  description: 可选，start_agent_run返回的运行ID
                text:
                  type: string
                  description: 包含一笔或多笔订单最新进展的自然语言文本
                  example: PO-AGENT-001工厂说现在做到60%，8月5日完工；PO-AGENT-002客户明天下午回复彩盒确认结果。
                source:
                  type: string
                  description: 调用来源
                  default: agent_tool
              required:
              - current_user_id
              - text
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: 请求参数或业务条件错误
        '401':
          description: 插件密钥错误
        '403':
          description: 无权限
        '404':
          description: 资源不存在
        '429':
          description: 达到工具调用或时间预算
  /api/agent/tools/priority-orders/diagnose:
    post:
      operationId: diagnose_priority_orders
      summary: 一次完成Top 7笔不同风险订单诊断
      description: 用于跨多笔订单检查并排序未来时间窗口内最需要处理的真实风险订单。用户要求“哪些订单最危险、最优先、最需要处理、风险巡检”时使用。内部复用FT04共享行动规则与异常证据；信息缺口单独返回，不凑Top N。不要用于单订单解释、批量进展文本解析或沟通草稿。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_id:
                  type: string
                  description: 组织ID，演示环境填写ORG-DEMO
                  default: ORG-DEMO
                current_user_id:
                  type: string
                  description: 当前FlowOrder用户ID，例如USER-1或MANAGER-1
                  example: USER-1
                current_role:
                  type: string
                  description: 当前角色
                  enum:
                  - operator
                  - manager
                  default: operator
                allowed_owner_ids:
                  type: array
                  description: 可选的额外授权负责人ID
                  items:
                    type: string
                run_id:
                  type: string
                  description: 可选，start_agent_run返回的运行ID
                due_within_days:
                  type: integer
                  minimum: 1
                  maximum: 90
                  default: 14
                  description: 默认交期时间窗口
                top_n:
                  type: integer
                  minimum: 1
                  maximum: 7
                  default: 7
                  description: 最多返回7笔不同的真实风险订单；不足不补齐
                scan_limit:
                  type: integer
                  minimum: 1
                  maximum: 200
                  default: 50
                  description: 候选池最多扫描订单数
                current_time:
                  type: string
                  format: date-time
                  description: 可选，默认北京时间当前时间
                persist_candidates:
                  type: boolean
                  default: true
                  description: 是否保存异常候选供网站查看
              required:
              - current_user_id
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: 请求参数或业务条件错误
        '401':
          description: 插件密钥错误
        '403':
          description: 无权限
        '404':
          description: 资源不存在
        '429':
          description: 达到工具调用或时间预算
