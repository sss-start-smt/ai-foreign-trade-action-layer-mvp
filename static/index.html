<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f8fb" />
  <title>AI外贸跟单行动层</title>
  <link rel="stylesheet" href="/static/styles.css?v=3" />
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar">
      <button class="brand" data-route="today" aria-label="返回今日行动">
        <span class="brand-mark"><i></i><i></i><i></i></span><span class="brand-text">AI外贸跟单行动层</span>
      </button>
      <nav class="side-nav" id="sideNav">
        <button class="nav-item" data-route="today" data-icon="bolt"><span>今日行动</span></button>
        <button class="nav-item" data-route="tasks" data-icon="clipboard"><span>全部任务</span></button>
        <button class="nav-item" data-route="orders" data-icon="box"><span>订单中心</span></button>
        <button class="nav-item" data-route="intake" data-icon="message"><span>消息接入</span></button>
        <button class="nav-item" data-route="confirm" data-icon="check-square"><span>AI确认</span><b id="reviewBadge">0</b></button>
        <button class="nav-item" data-route="manage" data-icon="chart"><span>管理看板</span></button>
        <button class="nav-item" data-route="settings" data-icon="settings"><span>设置</span></button>
      </nav>
      <div class="sidebar-foot"><div class="connection-pill"><i></i><span id="health">连接中</span></div></div>
    </aside>

    <section class="app-main">
      <header class="top-header">
        <button class="mobile-menu" id="mobileMenu" aria-label="打开菜单" data-icon="menu"></button>
        <div class="page-heading"><h1 id="pageTitle">今日行动工作台</h1><p id="pageSubtitle">把分散消息转成可执行、可等待、可追溯的下一步行动</p></div>
        <div class="top-actions">
          <label class="global-search"><span data-icon="search"></span><input id="globalSearch" type="search" placeholder="搜索当前页面…"/><kbd>⌘ K</kbd></label>
          <button class="icon-button" id="refreshBtn" title="刷新" data-icon="refresh"></button>
          <button class="icon-button notification" data-icon="bell"><b>6</b></button>
          <button class="profile-button"><span class="avatar">李</span><span><strong>李梅</strong><small>跟单专员</small></span></button>
        </div>
      </header>
      <main class="content" id="pageRoot"><div class="page-loading"><span></span>正在加载页面…</div></main>
    </section>
  </div>

  <nav class="mobile-nav" id="mobileNav">
    <button data-route="today" data-icon="bolt"><small>行动</small></button>
    <button data-route="orders" data-icon="box"><small>订单</small></button>
    <button data-route="intake" data-icon="message"><small>接入</small></button>
    <button data-route="confirm" data-icon="check-square"><small>确认</small></button>
    <button data-route="settings" data-icon="user"><small>我的</small></button>
  </nav>

  <dialog class="modal" id="modal"><form method="dialog"><div class="modal-head"><div><h3 id="modalTitle">操作</h3><p id="modalSubtitle"></p></div><button value="cancel" class="modal-close">×</button></div><div id="modalBody"></div><div class="modal-actions" id="modalActions"></div></form></dialog>
  <aside class="drawer" id="drawer"><div id="drawerBody"></div></aside><div class="drawer-mask" id="drawerMask"></div>
  <div class="toast" id="toast"></div>
  <script src="/static/app.js?v=3"></script>
</body>
</html>
